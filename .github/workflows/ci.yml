name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify-dictionaries:
    name: Verify dictionaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: make_dict/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r make_dict/requirements.txt

      - name: Run verification
        run: python make_dict/verify.py
